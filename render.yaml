services:
  - type: web
    name: x-bookmark-organizer
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn server:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FLASK_ENV
        value: production
      - key: LLM_PROVIDER
        value: auto
      - key: LLM_FALLBACK_PROVIDERS
        value: gemini,groq,openrouter
      - key: LLM_ALLOW_HEURISTIC_FALLBACK
        value: "false"
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: DATA_DIR
        value: /var/data
      # Set these in the Render dashboard (never in git):
      # SESSION_SECRET, APP_USERNAME, APP_PASSWORD_HASH,
      # GEMINI_API_KEY, GROQ_API_KEY, GROQ_MODEL,
      # OPENROUTER_API_KEY, OPENROUTER_MODEL,
      # OPENROUTER_SITE_URL, OPENROUTER_APP_NAME, APP_BASE_URL
    disk:
      name: xbookmarks-data
      mountPath: /var/data
      sizeGB: 1
